<section class="block"><div class="heading"><span><span class="icon">🖼️</span> 活动海报</span><span class="meta">以下为同一活动的海报参考</span></div>
<div class="posterPanel"><div class="posterTop">✦ 新手村奇遇嘉年华 ✦</div><div class="posters">
<button class="poster selected" data-poster="0" type="button" aria-pressed="true" aria-label="选择奇遇嘉年华海报"><img src="./assets/poster-adventure.svg" alt="新手村奇遇嘉年华：玩游戏、集印章、赢惊喜"><span class="posterCheck">✓</span></button>
<button class="poster" data-poster="1" type="button" aria-pressed="false" aria-label="选择伙伴集结海报"><img src="./assets/poster-friends.svg" alt="新手村伙伴集结：音乐、舞步、社团冒险"><span class="posterCheck">✓</span></button>
</div><p class="posterTip">冒险线索正在解锁 · 点击选择你喜欢的海报</p></div></section>
<button id="draw" class="draw" type="button" disabled>🎲 正在加载文案…</button>
<section id="resultSection"><div class="heading"><span><span class="icon">📄</span> 抽取结果 ✨</span><span class="meta" id="serial">还未抽取</span></div>
<div class="resultPanel"><div id="result" class="resultCopy" aria-live="polite">准备好了吗？点击上方黄色按钮，领取属于你的活动宣传文案！</div>
<div class="actionBar"><button id="again" type="button" class="act" disabled>↻ 重新抽取</button><button id="copy" type="button" class="act primary" disabled>▣ 复制文案</button><button id="back" type="button" class="act">↶ 返回选择</button></div></div></section>
<p class="notice" id="notice" role="status">先选择平台，再点击黄色按钮开始抽取。</p>
<p class="foot">📅 10月28日 16:00—22:00 · 东莞职业技术学院田径场<br>请按活动实际情况核对内容，自愿分享；本设备会记住已抽编号。</p>
</main></div></div>
<script>
"use strict";
const $=id=>document.getElementById(id);
let bank=null,platform="moments",currentText="",poster=0;
let inMemoryUsed={xhs:new Set(),moments:new Set()};
const STORAGE_PREFIX="nvd-carnival-used-v2-";
const API_BASE=""; // 可选：需要跨设备唯一时接入全局领取接口
const draw=$("draw"),again=$("again"),copy=$("copy"),notice=$("notice");
function usedIds(){
  const used=new Set(inMemoryUsed[platform]);
  try{
    const arr=JSON.parse(localStorage.getItem(STORAGE_PREFIX+platform)||"[]");
    if(Array.isArray(arr))arr.forEach(n=>{if(Number.isInteger(n)&&n>=0&&n<1000)used.add(n)});
  }catch{}
  return used;
}
function remember(id){
  inMemoryUsed[platform].add(id);
  try{const used=usedIds();localStorage.setItem(STORAGE_PREFIX+platform,JSON.stringify([...used]));}catch{}
}
function localRandomId(){
  const used=usedIds(),available=[];
  for(let i=0;i<1000;i++)if(!used.has(i))available.push(i);
  if(!available.length)throw new Error("本设备该平台1000条文案已抽完。");
  let rand;
  try{const n=new Uint32Array(1);crypto.getRandomValues(n);rand=n[0]}catch{rand=Math.floor(Math.random()*4294967296)}
  const id=available[rand%available.length];
  remember(id);
  return id;
}
async function getId(){
  if(!API_BASE)return localRandomId();
  const rsp=await fetch(API_BASE+"/claim?platform="+encodeURIComponent(platform),{method:"POST"});
  if(rsp.status===409)throw new Error("该平台1000条文案已全部分配。");
  if(!rsp.ok)throw new Error("领取服务暂不可用，请稍后再试。");
  const json=await rsp.json();
  if(!Number.isInteger(json.id)||json.id<0||json.id>=1000)throw new Error("收到无效的文案编号");
  return json.id;
}
let busy=false;
async function pick(){
  if(!bank||busy)return;
  busy=true;draw.disabled=true;again.disabled=true;notice.textContent="🎲 正在从1000条文案中抽取…";
  try{
    const id=await getId(),value=bank[id][platform];
    if(typeof value!=="string"||!value.trim())throw new Error("文案内容异常");
    currentText=value;$("result").textContent=currentText;$("serial").textContent=(platform==="xhs"?"小红书":"朋友圈")+" · "+String(id+1).padStart(4,"0")+"号";
    copy.disabled=false;
    notice.textContent="✨ 抽取成功！不满意可以重新抽取；点击复制即可粘贴到对应平台。";
    $("resultSection").scrollIntoView({behavior:"smooth",block:"nearest"});
  }catch(err){notice.textContent=err.message||"抽取失败，请重试";}finally{busy=false;draw.disabled=false;again.disabled=false;}
}
document.querySelectorAll(".channel").forEach(el=>el.addEventListener("click",()=>{
  if(busy)return;
  platform=el.dataset.platform;
  document.querySelectorAll(".channel").forEach(b=>{const active=b===el;b.classList.toggle("selected",active);b.setAttribute("aria-pressed",String(active))});
  currentText="";$("result").textContent="已切换到"+(platform==="xhs"?"小红书":"微信朋友圈")+"，点击黄色按钮抽取一条新文案。";
  $("serial").textContent="还未抽取";copy.disabled=true;again.disabled=true;
  notice.textContent="平台已切换，可以开始抽取。";
}));
document.querySelectorAll(".poster").forEach(el=>el.addEventListener("click",()=>{
  poster=Number(el.dataset.poster);
  document.querySelectorAll(".poster").forEach(b=>{const active=b===el;b.classList.toggle("selected",active);b.setAttribute("aria-pressed",String(active))});
  notice.textContent="已选择第"+(poster+1)+"张海报，长按图片可尝试保存；文案可单独复制。";
}));
draw.addEventListener("click",pick);again.addEventListener("click",pick);
$("back").addEventListener("click",()=>{$("platformSection").scrollIntoView({behavior:"smooth",block:"start"})});
copy.addEventListener("click",async()=>{
  if(!currentText)return;
  try{await navigator.clipboard.writeText(currentText);notice.textContent="✅ 已复制文案！现在可以打开对应平台粘贴。";}
  catch{
    const t=document.createElement("textarea");t.value=currentText;t.setAttribute("readonly","");t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();
    let ok=false;try{ok=document.execCommand("copy")}catch{}t.remove();
    notice.textContent=ok?"✅ 已复制文案！":"复制失败，请长按文案选中并复制。";
  }
});
fetch("./texts.json").then(r=>{if(!r.ok)throw new Error("未能加载文案库");return r.json()}).then(data=>{
  if(!Array.isArray(data)||data.length!==1000)throw new Error("文案库必须包含1000组");
  for(const key of ["xhs","moments"]){const all=data.map(x=>x&&x[key]);if(all.some(t=>typeof t!=="string"||!t.trim())||new Set(all).size!==1000)throw new Error(key+"文案缺失或重复");}
  bank=data;draw.disabled=false;draw.textContent="🎲 立即抽取文案";notice.textContent="文案库已就绪！小红书与朋友圈各1000条。";
}).catch(err=>{draw.textContent="文案加载失败";notice.textContent=err.message;});
</script>
</body></html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12aff2">
<meta name="description" content="新手村奇遇嘉年华文案抽取｜小红书与朋友圈各1000条活动宣传文案，一键抽取、重新抽取和复制。">
<title>活动宣传文案抽取 · 新手村奇遇嘉年华</title>
<style>
:root{--navy:#112b70;--deep:#091a4b;--blue:#1686f2;--sky:#22b5f5;--ink:#0c2357;--gold:#ffde37;--green:#03b77e;--red:#ff3464}
*,*:before,*:after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font-family:"Trebuchet MS","Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:#1aaaf2}
button{font:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid #ffce09;outline-offset:4px}
button:disabled{cursor:not-allowed;opacity:.65}
button:active:not(:disabled){transform:translateY(3px)}
.world{position:relative;min-height:100vh;padding:12px 14px 50px;overflow:hidden;background:linear-gradient(180deg,#05acf2 0,#5bcaff 50%,#80ddff 100%)}
.cloud{position:fixed;opacity:.85;pointer-events:none;background:#fff;width:95px;height:29px;left:2%;top:9%;box-shadow:26px -19px #fff,54px -9px #fff,8px 17px #c0eeff}
.cloud.two{left:auto;right:1%;top:33%;transform:scale(.65)}
.tree{position:absolute;bottom:50px;width:110px;height:215px;pointer-events:none;filter:drop-shadow(5px 6px #067354);background:linear-gradient(#0b9959,#0b9959) center bottom/24px 145px no-repeat}
.tree:before{content:"";position:absolute;inset:10px 0 auto;height:118px;background:linear-gradient(90deg,#44ef98 0 30%,#1cc671 30% 76%,#11ae68 76%);clip-path:polygon(26% 0,80% 0,80% 20%,100% 20%,100% 70%,80% 70%,80% 100%,15% 100%,15% 75%,0 75%,0 25%,26% 25%)}
.tree.left{left:-20px}.tree.right{right:-25px;transform:scale(1.15)}
.ground{position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(#32c96b 0 15px,#6097ce 15px 33px,#5075b4 33px);border-top:7px solid #167e66;pointer-events:none}
.ground:after{content:"";display:block;height:100%;background:repeating-linear-gradient(90deg,transparent 0 39px,#38569a 40px 44px,transparent 45px 96px);opacity:.55}
.spark{position:absolute;color:#ffe848;font-weight:900;font-size:38px;text-shadow:3px 4px #be680d;pointer-events:none}
.spark.a{left:4%;top:18%}.spark.b{right:4%;top:57%}.spark.c{left:4%;bottom:7%}
.phone{position:relative;z-index:1;width:100%;max-width:515px;margin:0 auto;background:#d5f8ff;border:8px solid #071126;border-radius:58px 58px 25px 25px;box-shadow:0 0 0 3px #5476b2,0 0 0 6px #020a23,0 18px 38px #0b296f80;overflow:hidden}
.statusbar{display:flex;align-items:center;justify-content:space-between;color:#fff;font-weight:900;background:#16abf0;padding:14px 30px 0;font-size:15px;line-height:1}
.statusbar .notch{width:86px;height:18px;border-radius:0 0 14px 14px;background:#070c1c;position:absolute;top:0;left:50%;transform:translateX(-50%)}
.banner{position:relative;min-height:265px;padding:15px 15px 20px;background:linear-gradient(#08abf6aa,#15bef45c),url("./assets/pixel-sky.svg") center 39%/cover no-repeat;text-align:center;overflow:hidden}
.brand{display:inline-flex;gap:7px;align-items:center;justify-content:center;color:#fff;text-shadow:2px 3px #093771;margin-bottom:11px;font-size:16px;font-weight:1000}
.brandMark{display:inline-grid;place-items:center;width:38px;height:38px;background:linear-gradient(140deg,#d4ffff,#c3def5);border:3px solid #102f73;box-shadow:4px 4px #e79b13;color:#143a75;font-weight:1000;font-size:29px;text-shadow:none;transform:rotate(-8deg)}
.brand small{display:block;letter-spacing:1.4px;font-size:7px;text-align:left;color:#ffef9c}
.banner h1{position:relative;margin:0 auto;color:white;line-height:1.03;font-size:clamp(39px,10vw,62px);font-weight:1000;letter-spacing:1px;-webkit-text-stroke:3.5px #0b215d;paint-order:stroke fill;text-shadow:4px 5px 0 #123980,7px 8px 0 #051d4b}
.banner h1 .highlight{color:#ffe54a}
.tagline{position:relative;margin:13px auto 0;display:inline-block;max-width:98%;padding:7px 14px;background:#fff2a5;border:3px solid #172e69;box-shadow:4px 4px 0 #e18a20;color:#08275e;font-weight:950;font-size:clamp(11px,3.4vw,14px);transform:rotate(-1deg)}
.banner .floaty{position:absolute;z-index:0;font-size:31px;filter:drop-shadow(3px 4px 0 #082e71)}
.banner .floaty.left{left:2%;top:95px}.banner .floaty.right{right:3%;top:125px}
.banner>*:not(.floaty){position:relative;z-index:1}
.main{position:relative;background:#f8fdff;padding:12px 12px 24px;margin:0 7px 7px;border:5px solid #123b84;box-shadow:inset 0 0 0 4px #b9ecff,0 5px 0 #248de3;border-radius:12px}
.block{position:relative;margin-bottom:15px}
.heading{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:2px 0 9px;font-size:18px;font-weight:1000;letter-spacing:.4px}
.heading .icon{font-size:23px}
.heading .meta{font-size:10px;font-weight:600;letter-spacing:0;color:#4b5d82;text-align:right}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.channel{position:relative;padding:11px 7px;min-height:72px;background:linear-gradient(#fff,#f5f9ff);border:3px solid #b5cdec;border-radius:14px;box-shadow:inset 0 0 0 2px white;display:flex;align-items:center;justify-content:center;gap:7px;color:#182c60;font-size:17px;font-weight:1000;white-space:nowrap}
.channel .mini{display:grid;place-items:center;flex-shrink:0;width:44px;height:41px;border-radius:10px;color:#fff;font-size:27px;text-shadow:1px 2px #10604b;background:linear-gradient(145deg,#2bdc99,#009d67)}
.channel[data-platform=xhs] .mini{background:linear-gradient(140deg,#ff3e60,#e90c46);font-size:12px;text-shadow:none}
.channel.selected[data-platform=moments]{border-color:#008f81;background:linear-gradient(#e2fff5,#cbffec);box-shadow:0 4px 0 #28b1a8}
.channel.selected[data-platform=xhs]{border-color:#f23368;background:linear-gradient(#fff2f7,#ffdeeb);box-shadow:0 4px 0 #f8abc2}
.channel .tick{position:absolute;top:-11px;right:-7px;border:3px solid white;box-shadow:0 0 0 2px #178b80;border-radius:50%;background:#00bb7d;color:#fff;display:none;font-size:14px;line-height:21px;width:25px;height:25px}
.channel.selected .tick{display:block}
.channel[data-platform=xhs] .tick{background:#f63b69}
.posterPanel{position:relative;background:#fff;border:3px solid #1a8be3;border-radius:14px;box-shadow:inset 0 0 0 3px #d1f5ff;padding:8px}
.posterTop{margin:0 auto 9px;width:86%;background:linear-gradient(#fff77a,#ffc325);border:3px solid #112d68;border-radius:9px;box-shadow:3px 4px 0 #d1811c;text-align:center;font-weight:1000;padding:5px 3px;font-size:17px}
.posters{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.poster{position:relative;display:block;border:3px solid #2878ce;border-radius:9px;padding:3px;background:#fff;box-shadow:2px 3px 0 #3a8fe6;overflow:hidden}
.poster img{display:block;width:100%;height:auto;aspect-ratio:460/625;object-fit:cover;border-radius:5px}
.poster .posterCheck{position:absolute;top:6px;right:6px;color:white;border:3px solid white;background:#1689f9;border-radius:50%;font-size:14px;width:26px;height:26px;line-height:21px;text-align:center;display:none;box-shadow:1px 2px #063976}
.poster.selected{outline:3px solid #198ef6}.poster.selected .posterCheck{display:block}
.posterTip{font-size:11px;color:#436197;text-align:center;margin:8px 1px 0}
.draw{position:relative;display:block;width:100%;margin:18px auto 17px;background:linear-gradient(180deg,#fff56b 0,#ffe61f 48%,#ffb312 100%);border:5px solid #142b61;border-radius:12px;box-shadow:0 7px 0 #c75810,inset 0 5px 0 #fff6b5;text-align:center;font-size:clamp(22px,6vw,33px);color:#231a18;font-weight:1000;padding:15px 4px;text-shadow:2px 2px white}
.draw::before,.draw::after{content:"✦";color:#ff9809;font-size:25px;position:absolute;top:-18px}.draw::before{left:3%}.draw::after{right:3%}
.resultPanel{background:#fff;border:3px solid #2484d4;border-radius:12px;box-shadow:inset 0 0 0 3px #d2efff;padding:11px}
.resultCopy{position:relative;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px;line-height:1.75;background:#edf7ff;border:2px solid #c9dff8;border-radius:10px;padding:13px;min-height:128px;max-height:290px;overflow-y:auto;color:#122d60;user-select:text;-webkit-user-select:text}
.actionBar{display:grid;grid-template-columns:1fr 1.18fr 1fr;gap:7px;margin-top:10px}
.act{border:2.5px solid #1765ad;box-shadow:0 3px 0 #b6e3ff;border-radius:10px;background:#e9f6ff;color:#124785;padding:12px 1px;font-weight:950;font-size:12px;white-space:nowrap}
.act.primary{background:linear-gradient(#28b8ff,#0079f4);color:#fff;border-color:#194e9d;box-shadow:0 4px 0 #0a47b7;font-size:14px}
.notice{font-size:11px;line-height:1.6;color:#46618f;text-align:center;margin:13px 3px 0}
.foot{font-size:11px;text-align:center;line-height:1.6;color:#4d6895;margin:12px 4px 0}
.badgeInfo{display:inline-flex;align-items:center;gap:4px;background:#e9f5ff;border-radius:20px;color:#1d5ea0;font-size:11px;font-weight:750;padding:3px 8px}
@media(min-width:620px){.world{padding-top:24px}.phone{border-radius:60px 60px 30px 30px}.tree.left{left:calc(50% - 420px)}.tree.right{right:calc(50% - 420px)}}
@media(max-width:520px){.world{padding:0 0 30px}.phone{border:0;border-radius:0;box-shadow:none}.statusbar{display:none}.banner{padding-top:22px;min-height:237px}.main{margin:0 6px;padding:12px 10px 20px}.heading{font-size:16px}.heading .meta{font-size:9px}.channel{font-size:15px;padding:9px 3px}.channel .mini{width:39px;height:39px}.posterTop{font-size:15px}.tree,.spark,.cloud{display:none}}
@media(max-width:350px){.banner h1{font-size:38px}.channel{font-size:12px}.channel .mini{width:34px;height:34px;font-size:21px}.channel[data-platform=xhs] .mini{font-size:10px}.actionBar{gap:5px}.act{font-size:11px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body><div class="world">
<div class="cloud"></div><div class="cloud two"></div><div class="tree left"></div><div class="tree right"></div><div class="spark a">✦</div><div class="spark b">✦</div><div class="spark c">✦</div><div class="ground"></div>
<div class="phone">
<div class="statusbar"><span>9:41</span><span class="notch"></span><span>▮▮▮ ◕ ▰</span></div>
<header class="banner">
<span class="floaty left" aria-hidden="true">✦</span><span class="floaty right" aria-hidden="true">🪙</span>
<div class="brand"><span class="brandMark" aria-hidden="true">N</span><span>新手村次元<small>NEWBIE VILLAGE DIMENSION</small></span></div>
<h1>活动宣传<br><span class="highlight">文案</span>抽取</h1>
<div class="tagline">一键抽取活动文案，轻松分享到朋友圈或小红书！</div>
</header>
<main class="main">
<section class="block" id="platformSection"><div class="heading"><span><span class="icon">🎮</span> 选择发布平台</span><span class="badgeInfo">① 选择平台</span></div>
<div class="picks" role="group" aria-label="选择发布平台">
<button type="button" class="channel selected" data-platform="moments" aria-pressed="true"><span class="mini" aria-hidden="true">☏</span><span>微信朋友圈</span><span class="tick">✓</span></button>
<button type="button" class="channel" data-platform="xhs" aria-pressed="false"><span class="mini" aria-hidden="true">小红书</span><span>小红书</span><span class="tick">✓</span></button>
</div></section>
<section class="block"><div class="heading"><span><span class="icon">🖼️</span> 活动海报</span><span class="meta">以下为同一活动的海报参考</span></div>
<div class="posterPanel"><div class="posterTop">✦ 新手村奇遇嘉年华 ✦</div><div class="posters">
<button class="poster selected" data-poster="0" type="button" aria-pressed="true" aria-label="选择奇遇嘉年华海报"><img src="./assets/poster-adventure.svg" alt="新手村奇遇嘉年华：玩游戏、集印章、赢惊喜"><span class="posterCheck">✓</span></button>
<button class="poster" data-poster="1" type="button" aria-pressed="false" aria-label="选择伙伴集结海报"><img src="./assets/poster-friends.svg" alt="新手村伙伴集结：音乐、舞步、社团冒险"><span class="posterCheck">✓</span></button>
</div><p class="posterTip">冒险线索正在解锁 · 点击选择你喜欢的海报</p></div></section>
<button id="draw" class="draw" type="button" disabled>🎲 正在加载文案…</button>
<section id="resultSection"><div class="heading"><span><span class="icon">📄</span> 抽取结果 ✨</span><span class="meta" id="serial">还未抽取</span></div>
<div class="resultPanel"><div id="result" class="resultCopy" aria-live="polite">准备好了吗？点击上方黄色按钮，领取属于你的活动宣传文案！</div>
<div class="actionBar"><button id="again" type="button" class="act" disabled>↻ 重新抽取</button><button id="copy" type="button" class="act primary" disabled>▣ 复制文案</button><button id="back" type="button" class="act">↶ 返回选择</button></div></div></section>
<p class="notice" id="notice" role="status">先选择平台，再点击黄色按钮开始抽取。</p>
<p class="foot">📅 10月28日 16:00—22:00 · 东莞职业技术学院田径场<br>请按活动实际情况核对内容，自愿分享；本设备会记住已抽编号。</p>
</main></div></div>
<script>
"use strict";
const $=id=>document.getElementById(id);
let bank=null,platform="moments",currentText="",poster=0;
let inMemoryUsed={xhs:new Set(),moments:new Set()};
const STORAGE_PREFIX="nvd-carnival-used-v2-";
const API_BASE=""; // 可选：需要跨设备唯一时接入全局领取接口
const draw=$("draw"),again=$("again"),copy=$("copy"),notice=$("notice");
function usedIds(){
  const used=new Set(inMemoryUsed[platform]);
  try{
    const arr=JSON.parse(localStorage.getItem(STORAGE_PREFIX+platform)||"[]");
    if(Array.isArray(arr))arr.forEach(n=>{if(Number.isInteger(n)&&n>=0&&n<1000)used.add(n)});
  }catch{}
  return used;
}
function remember(id){
  inMemoryUsed[platform].add(id);
  try{const used=usedIds();localStorage.setItem(STORAGE_PREFIX+platform,JSON.stringify([...used]));}catch{}
}
function localRandomId(){
  const used=usedIds(),available=[];
  for(let i=0;i<1000;i++)if(!used.has(i))available.push(i);
  if(!available.length)throw new Error("本设备该平台1000条文案已抽完。");
  let rand;
  try{const n=new Uint32Array(1);crypto.getRandomValues(n);rand=n[0]}catch{rand=Math.floor(Math.random()*4294967296)}
  const id=available[rand%available.length];
  remember(id);
  return id;
}
async function getId(){
  if(!API_BASE)return localRandomId();
  const rsp=await fetch(API_BASE+"/claim?platform="+encodeURIComponent(platform),{method:"POST"});
  if(rsp.status===409)throw new Error("该平台1000条文案已全部分配。");
  if(!rsp.ok)throw new Error("领取服务暂不可用，请稍后再试。");
  const json=await rsp.json();
  if(!Number.isInteger(json.id)||json.id<0||json.id>=1000)throw new Error("收到无效的文案编号");
  return json.id;
}
let busy=false;
async function pick(){
  if(!bank||busy)return;
  busy=true;draw.disabled=true;again.disabled=true;notice.textContent="🎲 正在从1000条文案中抽取…";
  try{
    const id=await getId(),value=bank[id][platform];
    if(typeof value!=="string"||!value.trim())throw new Error("文案内容异常");
    currentText=value;$("result").textContent=currentText;$("serial").textContent=(platform==="xhs"?"小红书":"朋友圈")+" · "+String(id+1).padStart(4,"0")+"号";
    copy.disabled=false;
    notice.textContent="✨ 抽取成功！不满意可以重新抽取；点击复制即可粘贴到对应平台。";
    $("resultSection").scrollIntoView({behavior:"smooth",block:"nearest"});
  }catch(err){notice.textContent=err.message||"抽取失败，请重试";}finally{busy=false;draw.disabled=false;again.disabled=false;}
}
document.querySelectorAll(".channel").forEach(el=>el.addEventListener("click",()=>{
  if(busy)return;
  platform=el.dataset.platform;
  document.querySelectorAll(".channel").forEach(b=>{const active=b===el;b.classList.toggle("selected",active);b.setAttribute("aria-pressed",String(active))});
  currentText="";$("result").textContent="已切换到"+(platform==="xhs"?"小红书":"微信朋友圈")+"，点击黄色按钮抽取一条新文案。";
  $("serial").textContent="还未抽取";copy.disabled=true;again.disabled=true;
  notice.textContent="平台已切换，可以开始抽取。";
}));
document.querySelectorAll(".poster").forEach(el=>el.addEventListener("click",()=>{
  poster=Number(el.dataset.poster);
  document.querySelectorAll(".poster").forEach(b=>{const active=b===el;b.classList.toggle("selected",active);b.setAttribute("aria-pressed",String(active))});
  notice.textContent="已选择第"+(poster+1)+"张海报，长按图片可尝试保存；文案可单独复制。";
}));
draw.addEventListener("click",pick);again.addEventListener("click",pick);
$("back").addEventListener("click",()=>{$("platformSection").scrollIntoView({behavior:"smooth",block:"start"})});
copy.addEventListener("click",async()=>{
  if(!currentText)return;
  try{await navigator.clipboard.writeText(currentText);notice.textContent="✅ 已复制文案！现在可以打开对应平台粘贴。";}
  catch{
    const t=document.createElement("textarea");t.value=currentText;t.setAttribute("readonly","");t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();
    let ok=false;try{ok=document.execCommand("copy")}catch{}t.remove();
    notice.textContent=ok?"✅ 已复制文案！":"复制失败，请长按文案选中并复制。";
  }
});
fetch("./texts.json").then(r=>{if(!r.ok)throw new Error("未能加载文案库");return r.json()}).then(data=>{
  if(!Array.isArray(data)||data.length!==1000)throw new Error("文案库必须包含1000组");
  for(const key of ["xhs","moments"]){const all=data.map(x=>x&&x[key]);if(all.some(t=>typeof t!=="string"||!t.trim())||new Set(all).size!==1000)throw new Error(key+"文案缺失或重复");}
  bank=data;draw.disabled=false;draw.textContent="🎲 立即抽取文案";notice.textContent="文案库已就绪！小红书与朋友圈各1000条。";
}).catch(err=>{draw.textContent="文案加载失败";notice.textContent=err.message;});
</script>
</body></html>
